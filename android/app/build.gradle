plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.aoshi.auto_mobile"
    // 显式钉死 compileSdk / targetSdk，避免被 Flutter SDK 默认值带回 33。
    // 关键 API 依赖：AccessibilityServiceInfo.canTakeScreenshot 来自 API 34，
    // 项目目标机也是 vivo X200（Android 14），把基线对齐到 34。
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.aoshi.auto_mobile"
        // minSdk 不能低于 26：AccessibilityService.dispatchGesture 从 API 26 起完整可用，
        // takeScreenshot 还需要 API 30+，但编译期只需要 ≥ 26 即可。
        // 用 Math.max 而非 Kotlin maxOf：build.gradle 是 Groovy DSL，AGP 的 defaultConfig 闭包
        // 不暴露 Kotlin 标准库的扩展函数。
        minSdk = Math.max(flutter.minSdkVersion, 26)
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
}

flutter {
    source = "../.."
}
